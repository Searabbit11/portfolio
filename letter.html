<!doctype html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>신지원 · 자기소개서</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="theme/theme.css">
  <script>
    try {
      if (localStorage.getItem('portfolio-color-mode') === 'light') document.documentElement.dataset.theme = 'light';
    } catch {}
  </script>
  <style>
    :root {
      color-scheme: dark;
      --paper: var(--t-bg, #0a0a0d);
      --ink: var(--t-ink, #f4f4f6);
      --body: var(--t-body, #bdbdc7);
      --line: var(--t-line, #24242c);
      --accent: color-mix(in srgb, var(--t-accent, #2f6feb) 64%, #fff);
      --bar-height: 3.75rem;
    }
    :root[data-theme="light"] { color-scheme: light; --paper: #f8f6f1; --ink: #23211e; --body: #5d574f; --line: #d8d2c8; --accent: #2456bd; }
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 1rem/1.75 Pretendard, "Malgun Gothic", sans-serif; }
    a { color: inherit; text-underline-offset: 0.23em; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    .wrap { width: min(calc(100% - 2rem), 70rem); margin-inline: auto; }
    .skip { position: fixed; z-index: 20; left: 1rem; top: 0.6rem; transform: translateY(-150%); padding: 0.35rem 0.6rem; background: var(--paper); }
    .skip:focus { transform: none; }
    .toolbar { position: sticky; top: 0; z-index: 5; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--paper) 94%, transparent); backdrop-filter: blur(12px); }
    .toolbar-content { min-height: var(--bar-height); display: flex; justify-content: space-between; align-items: center; gap: 0.55rem; }
    .back { text-decoration: none; font-weight: 690; white-space: nowrap; }
    .back:hover { color: var(--accent); }
    .actions { display: flex; gap: 0.4rem; }
    .actions button { padding: 0.32rem 0.75rem; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); color: var(--ink); cursor: pointer; white-space: nowrap; font: inherit; font-size: 0.85rem; }
    .actions button:hover { border-color: var(--accent); color: var(--accent); }
    .layout { display: grid; grid-template-columns: minmax(10rem, 13rem) minmax(0, 44rem); grid-template-areas: "empty title" "contents body"; column-gap: clamp(1.7rem, 5.5vw, 5rem); }
    .document-title { grid-area: title; padding: clamp(2.75rem, 7vw, 5.25rem) 0 1.6rem; border-bottom: 1px solid var(--line); }
    .document-title h1 { margin: 0; font-size: clamp(2.45rem, 6vw, 4.2rem); line-height: 1.07; letter-spacing: -0.06em; }
    .document-title p { margin: 0.35rem 0 0; color: var(--body); }
    .toc { grid-area: contents; position: sticky; top: calc(var(--bar-height) + 1.5rem); align-self: start; margin-top: 1.75rem; }
    .toc strong { font-size: 0.86rem; font-weight: 680; }
    .toc ul { margin: 0.65rem 0 0; padding: 0; list-style: none; border-left: 1px solid var(--line); }
    .toc a { display: block; padding: 0.35rem 0.65rem; border-left: 2px solid transparent; margin-left: -1px; color: var(--body); text-decoration: none; font-size: 0.9rem; line-height: 1.4; }
    .toc a:hover, .toc a[aria-current] { color: var(--accent); }
    .toc a[aria-current] { border-left-color: var(--accent); font-weight: 700; }
    .prose { grid-area: body; min-width: 0; padding-bottom: clamp(3rem, 8vw, 7rem); }
    .prose h2 { margin: 3.25rem 0 0.8rem; font-size: clamp(1.35rem, 2.8vw, 2rem); font-weight: 730; letter-spacing: -0.035em; line-height: 1.3; scroll-margin-top: calc(var(--bar-height) + 1.2rem); }
    .prose h2:first-child { margin-top: 1.7rem; }
    .prose p { margin: 0 0 0.9rem; color: var(--body); word-break: keep-all; overflow-wrap: break-word; }
    .source-link { display: block; margin-top: 2.6rem; padding-top: 1rem; border-top: 1px solid var(--line); color: var(--accent); font-size: 0.9rem; }
    @media (max-width: 720px) {
      :root { --bar-height: 3.4rem; }
      .layout { grid-template-columns: minmax(0, 1fr); grid-template-areas: "title" "contents" "body"; }
      .toc { position: static; margin-top: 1.15rem; }
      .toc ul { display: flex; flex-wrap: wrap; gap: 0.35rem 0.75rem; border-left: 0; }
      .toc a { border-left: 0; margin: 0; padding: 0.2rem 0; }
      .toc a[aria-current] { text-decoration: underline; }
      .back, .actions button { font-size: 0.81rem; }
      .actions button { padding-inline: 0.55rem; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    @page { size: A4; margin: 17mm 18mm; }
    @media print {
      body { background: #fff; color: #141414; font-size: 10.5pt; line-height: 1.65; }
      .toolbar, .toc, .source-link, .skip { display: none; }
      .layout { display: block; width: 100%; }
      .document-title { padding: 0 0 7mm; border-bottom-color: #ddd; }
      .document-title h1 { font-size: 24pt; }
      .document-title p, .prose p { color: #242424; }
      .prose { padding-bottom: 0; }
      .prose h2 { margin: 7mm 0 2.5mm; font-size: 14pt; break-after: avoid; }
      .prose h2:first-child { margin-top: 6mm; }
      .prose p { margin-bottom: 3mm; orphans: 3; widows: 3; }
    }
  </style>
  <script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
</head>
<body>
  <a class="skip" href="#content">본문으로 건너뛰기</a>
  <header class="toolbar">
    <div class="wrap toolbar-content">
      <a class="back" href="./#intro">← 포트폴리오</a>
      <div class="actions">
        <button type="button" id="toggle-theme">라이트 모드</button>
        <button type="button" id="print-letter" disabled>PDF로 저장</button>
      </div>
    </div>
  </header>
  <main class="wrap layout" id="content">
    <header class="document-title">
      <h1>자기소개서</h1>
      <p>신지원 · Unity 클라이언트 프로그래머</p>
    </header>
    <nav class="toc" aria-label="자기소개서 목차" hidden>
      <strong>목차</strong>
      <ul id="contents"></ul>
    </nav>
    <article class="prose">
      <div id="letter"><p role="status">자기소개서를 불러오는 중입니다.</p></div>
      <a class="source-link" href="https://drive.google.com/file/d/1zf3AeNi8oBldIZseTUVHErYt6bgKmGtL/view?usp=drive_link" target="_blank" rel="noopener noreferrer">이력서·자기소개서 원본 PDF ↗</a>
    </article>
  </main>
  <script>
    const root = document.documentElement;
    const mode = document.getElementById('toggle-theme');
    const print = document.getElementById('print-letter');

    function updateModeLabel() {
      const next = root.dataset.theme === 'dark' ? '라이트 모드' : '다크 모드';
      mode.textContent = next;
      mode.setAttribute('aria-label', next + '로 전환');
    }

    updateModeLabel();
    mode.addEventListener('click', () => {
      root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem('portfolio-color-mode', root.dataset.theme); } catch {}
      updateModeLabel();
    });
    print.addEventListener('click', () => window.print());

    function setUpContents(headings) {
      const list = document.getElementById('contents');
      const ids = new Set();
      const links = headings.map(heading => {
        const slug = heading.textContent.trim().normalize('NFKC').toLowerCase()
          .replace(/\s+/g, '-').replace(/[^\p{Letter}\p{Number}-]/gu, '') || 'section';
        let id = slug;
        for (let suffix = 2; ids.has(id); suffix++) id = slug + '-' + suffix;
        ids.add(id);
        heading.id = id;
        const item = document.createElement('li');
        const link = document.createElement('a');
        link.href = '#' + encodeURIComponent(id);
        link.textContent = heading.textContent;
        item.append(link);
        list.append(item);
        return link;
      });
      if (!links.length) return;
      list.closest('nav').hidden = false;
      let previous = -1;
      let frame = 0;

      function highlight() {
        frame = 0;
        const line = Math.max(100, window.innerHeight * 0.25);
        let current = -1;
        for (let i = 0; i < headings.length; i++) {
          if (headings[i].getBoundingClientRect().top <= line) current = i;
        }
        if (window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 2) current = links.length - 1;
        if (current === previous) return;
        links[previous]?.removeAttribute('aria-current');
        links[current]?.setAttribute('aria-current', 'location');
        previous = current;
      }

      function schedule() {
        if (!frame) frame = requestAnimationFrame(highlight);
      }

      window.addEventListener('scroll', schedule, { passive: true });
      window.addEventListener('resize', schedule);
      highlight();
      const initial = headings.find(heading => '#' + encodeURIComponent(heading.id) === window.location.hash);
      initial?.scrollIntoView();
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const article = document.getElementById('letter');
      try {
        const response = await fetch(encodeURIComponent('자기소개서.md'), { cache: 'no-cache' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        article.innerHTML = marked.parse(await response.text());
        article.querySelector('h1')?.remove();
        setUpContents([...article.querySelectorAll('h2')]);
        print.disabled = false;
      } catch (error) {
        article.innerHTML = '<p role="alert">본문을 불러오지 못했습니다. 아래 링크에서 원본 PDF를 열 수 있습니다.</p>';
        console.error(error);
      }
    });
  </script>
</body>
</html>
