    function normalizeLink(value) {
      try {
        const url = new URL(value);
        if (url.protocol === 'http:' || url.protocol === 'https:') return url.href;
      } catch {}
      return '';
    }

    function asset(project, relative) {
      return './src/' + [project.id, ...relative.replace(/^\.\//, '').split('/')].map(encodeURIComponent).join('/');
    }

    function ExternalLink({ href, children, className = 'text-link', showArrow = true }) {
      const url = normalizeLink(href);
      return url && <a className={className} href={url} target="_blank" rel="noopener noreferrer">{children}{showArrow && <span aria-hidden="true">↗</span>}</a>;
    }

    function Inline({ value }) {
      return String(value || '').split('`').map((part, index) =>

      const arEvidence = unityEvidence.filter(isArEvidence);
      const libraries = libraryNames.map(name => byName.get(name)).filter(Boolean);

    function Portfolio({ data, projects }) {
      const hero = useRef(null);
      const [mode, setMode] = useState(document.documentElement.dataset.theme);
      const [visible, setVisible] = useState(false);
      const [active, setActive] = useState('');
      const labels = sectionIds.map(id => [id, id === 'experience' ? '경력' : PFStr.t('page.nav-' + id)]);

      useEffect(() => {
        const sections = sectionIds.map(id => document.getElementById(id));
        let frame = 0;
        const update = () => {
          frame = 0;
          const heroBottom = hero.current.getBoundingClientRect().bottom;
          const line = Math.min(window.innerHeight * 0.24, 180);
          setVisible(heroBottom <= line);
          const found = sections.findLast(section => section.getBoundingClientRect().top <= line);
          const atBottom = window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 4;
          setActive(atBottom ? 'contact' : found?.id || '');
        };
        const schedule = () => {
          if (!frame) frame = requestAnimationFrame(update);
        };
        window.addEventListener('scroll', schedule, { passive: true });
        window.addEventListener('resize', schedule);
        let hash = window.location.hash.slice(1);
        try { hash = decodeURIComponent(hash); } catch {}
        document.getElementById(hash)?.scrollIntoView({ block: 'start', behavior: 'instant' });
        update();
        return () => {
          cancelAnimationFrame(frame);
          window.removeEventListener('scroll', schedule);
          window.removeEventListener('resize', schedule);
        };
      }, []);

      useLayoutEffect(() => {
        if (!('IntersectionObserver' in window)) return;

        const targets = document.querySelectorAll('[data-reveal]');
        const observer = new IntersectionObserver(entries => {
          for (const entry of entries) {
            if (!entry.isIntersecting) continue;
            entry.target.classList.replace('reveal-pending', 'revealed');
            observer.unobserve(entry.target);
          }
        }, { rootMargin: '0px 0px -56px 0px' });

        targets.forEach(target => {
          target.classList.add('reveal-pending');
          observer.observe(target);
        });
        return () => observer.disconnect();
      }, []);

      function toggleTheme() {
        const selected = mode === 'dark' ? 'light' : 'dark';
        document.documentElement.dataset.theme = selected;
        setMode(selected);
        try { localStorage.setItem('portfolio-color-mode', selected); } catch {}
      }

      const theme = { mode, toggle: toggleTheme };
      return <>
        <a className="skip-link" href="#intro">본문으로 건너뛰기</a>
        <Navigation name={data.profile.name} visible={visible} active={active} theme={theme} labels={labels} />
        <main>
          <Hero profile={data.profile} projects={projects} theme={theme} heroRef={hero} />
          <About />
          <Experience />
          <Skills skills={data.skills || []} projects={projects} />
          <section id="projects" className="section projects-section" aria-labelledby="project-list-title">
            <div className="body-wrap project-list-heading" data-reveal="">
              <h2 id="project-list-title" className="section-title">{PFStr.t('page.nav-projects')}</h2>
            </div>
            <div className="project-list">{projects.map(project => <Project project={project} key={project.id} />)}</div>
          </section>
        </main>
        <Contact profile={data.profile} />
      </>;
    }

    async function readJson(path) {
      const response = await fetch(path, { cache: 'no-cache' });
      if (!response.ok) throw new Error(path + ' HTTP ' + response.status);
      return response.json();
    }

    const root = ReactDOM.createRoot(document.getElementById('app'));
    Promise.all([readJson('./data/portfolio.json'), PFStr.load('./theme/strings.tsv')])
      .then(async ([data]) => {
        const projects = await Promise.all(data.projects.map(id => readJson('./data/projects/' + encodeURIComponent(id) + '.json')));
        document.title = data.profile.name + ' · Unity 클라이언트 포트폴리오';
        root.render(<Portfolio data={data} projects={projects} />);
      })
      .catch(error => {
        console.error(error);
        root.render(<div className="status"><div><p>포트폴리오를 불러오지 못했습니다.</p><a className="text-link" href="./classic.html">기본 포트폴리오 열기</a></div></div>);
      });
  </script>
</body>
</html>
